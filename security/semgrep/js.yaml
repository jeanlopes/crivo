# crivo custom rules for JavaScript/TypeScript (P11). Each rule id carries the SEC- control it enforces.
# They complement, not replace, the registry rulesets listed in security/README.md.
rules:
  - id: crivo.sec-001.sql-built-from-strings
    message: SQL built by string interpolation or concatenation (SEC-001). Use bound parameters or a tagged template (sql`...`).
    severity: ERROR
    languages: [javascript, typescript]
    metadata: { control: SEC-001, cwe: "CWE-89" }
    pattern-either:
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.query("..." + $X, ...)
      - pattern: $DB.execute(`...${$X}...`, ...)
      - pattern: $DB.execute("..." + $X, ...)
      - pattern: $DB.raw(`...${$X}...`, ...)
      - pattern: $DB.raw("..." + $X, ...)
      - pattern: $DB.$queryRawUnsafe(...)
      - pattern: $DB.$executeRawUnsafe(...)
      - pattern: $SQL.unsafe(...)

  - id: crivo.sec-003.shell-with-input
    message: Shell command built from input (SEC-003). Use execFile/spawn with an argument array and shell disabled.
    severity: ERROR
    languages: [javascript, typescript]
    metadata: { control: SEC-003, cwe: "CWE-78" }
    pattern-either:
      - pattern: $CP.exec(`...${$X}...`, ...)
      - pattern: $CP.execSync(`...${$X}...`, ...)
      - pattern: $CP.exec("..." + $X, ...)
      - pattern: $CP.execSync("..." + $X, ...)
      - pattern: exec(`...${$X}...`, ...)
      - pattern: execSync(`...${$X}...`, ...)
      - pattern: exec("..." + $X, ...)
      - pattern: execSync("..." + $X, ...)
      - pattern: '$CP.spawn($C, $A, {..., shell: true, ...})'
      - pattern: 'spawn($C, $A, {..., shell: true, ...})'

  - id: crivo.sec-016.raw-html-sink
    message: Raw HTML sink (SEC-016). Render through the framework, or sanitize with DOMPurify and reference a RULE-.
    severity: ERROR
    languages: [javascript, typescript]
    metadata: { control: SEC-016, cwe: "CWE-79" }
    patterns:
      - pattern-either:
          - pattern: $E.innerHTML = $X
          - pattern: $E.outerHTML = $X
          - pattern: $E.insertAdjacentHTML($P, $X)
          - pattern: document.write($X)
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-not: '"..."'
            - pattern-not: DOMPurify.sanitize(...)
            - pattern-not: sanitize(...)

  - id: crivo.sec-024.cors-reflects-origin
    message: CORS reflects the caller's Origin or allows any origin (SEC-024). Use an explicit allow-list.
    severity: ERROR
    languages: [javascript, typescript]
    metadata: { control: SEC-024, cwe: "CWE-942" }
    pattern-either:
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", $REQ.headers.origin)
      - pattern: $RES.header("Access-Control-Allow-Origin", $REQ.headers.origin)
      - pattern: $RES.set("Access-Control-Allow-Origin", $REQ.headers.origin)
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", $REQ.get("origin"))
      - pattern: '$CORS({..., origin: true, ...})'
      - pattern: '$CORS({..., origin: "*", ...})'

  - id: crivo.sec-026.cookie-flag-disabled
    message: Cookie security flag explicitly disabled (SEC-026).
    severity: ERROR
    languages: [javascript, typescript]
    metadata: { control: SEC-026, cwe: "CWE-1004" }
    pattern-either:
      - pattern: '$RES.cookie($N, $V, {..., httpOnly: false, ...})'
      - pattern: '$RES.cookie($N, $V, {..., secure: false, ...})'

  - id: crivo.sec-027.open-redirect
    message: Redirect target taken from the request (SEC-027). Redirect only to allow-listed paths or origins.
    severity: ERROR
    languages: [javascript, typescript]
    metadata: { control: SEC-027, cwe: "CWE-601" }
    pattern-either:
      - pattern: $RES.redirect($REQ.query.$P)
      - pattern: $RES.redirect($REQ.body.$P)
      - pattern: $RES.redirect($REQ.params.$P)
      - pattern: $RES.redirect($REQ.query[$P])
      - pattern: $RES.redirect($CODE, $REQ.query.$P)

  - id: crivo.sec-028.postmessage-wildcard
    message: postMessage with targetOrigin "*" (SEC-028). Name the receiving origin.
    severity: ERROR
    languages: [javascript, typescript]
    metadata: { control: SEC-028, cwe: "CWE-345" }
    pattern: $W.postMessage($M, "*", ...)

  - id: crivo.sec-050.credential-in-url
    message: Credential-like parameter in a URL (SEC-050). Hand off with a one-time code exchanged server-side.
    severity: ERROR
    languages: [javascript, typescript]
    metadata: { control: SEC-050, cwe: "CWE-598" }
    pattern-regex: '[?&#](access_token|id_token|refresh_token|token|jwt|session|session_id|sessionid|api_key|apikey|password)='

  - id: crivo.sec-051.jwt-not-verified
    message: JWT decoded without verification, or 'none' algorithm allowed (SEC-051). Use verify() with a pinned algorithm list.
    severity: ERROR
    languages: [javascript, typescript]
    metadata: { control: SEC-051, cwe: "CWE-347" }
    pattern-either:
      - pattern: jwt.decode(...)
      - pattern: jsonwebtoken.decode(...)
      - pattern: '$JWT.verify($T, $K, {..., algorithms: [..., "none", ...], ...})'

  - id: crivo.sec-068.tls-verification-disabled
    message: TLS certificate verification disabled (SEC-068).
    severity: ERROR
    languages: [javascript, typescript]
    metadata: { control: SEC-068, cwe: "CWE-295" }
    pattern-either:
      - pattern: '{..., rejectUnauthorized: false, ...}'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: crivo.sec-070.insecure-random-secret
    message: Math.random() used for a security value (SEC-070). Use crypto.randomBytes / crypto.randomUUID.
    severity: ERROR
    languages: [javascript, typescript]
    metadata: { control: SEC-070, cwe: "CWE-338" }
    patterns:
      - pattern-either:
          - pattern: const $V = <... Math.random() ...>;
          - pattern: let $V = <... Math.random() ...>;
          - pattern: var $V = <... Math.random() ...>;
          - pattern: $V = <... Math.random() ...>
      - metavariable-regex:
          metavariable: $V
          regex: (?i).*(token|secret|nonce|otp|code|salt|passw|key|session|invite|reset).*
