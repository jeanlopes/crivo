# crivo gauntlet — declarative pipeline definition.
# Protected path (P06). Agents MUST NOT edit this file.
#
# kind: gate      -> binary; failure halts and zeroes the confidence index
# kind: gradient  -> value in [0,1]; enters the confidence index; optional `min` also halts
# Each layer writes .crivo/results/<id>.json  {"id","status":"pass|fail","metric":<float|null>,"details":{}}

version: 1
results_dir: .crivo/results
fail_fast: true

layers:
  - id: types
    kind: gate
    description: Static typing in strict mode. Zero errors.

  - id: lint
    kind: gate
    description: Linters with zero suppressions unless each carries a RULE- or issue reference.
    rules:
      zero_suppressions: true
      no_swallow: true          # broad catch/except without re-raise or RULE- reference
      no_unbounded_call: true       # AP-049 (P10)
      no_unbounded_resource: true   # AP-054 (P10)
      retry_requires_jitter: true   # AP-060 (P10)
      no_walltime_ordering: true    # AP-037 (P10)

  - id: unit
    kind: gate
    description: Unit tests, randomized order, repeated to detect flakiness.
    opts:
      random_order: true
      repeat: 3
      skip_requires_issue: true
      assertion_count_ratchet: true   # assertion count may not decrease without SPEC amendment
    emits:
      - flaky_rate
      - spec_to_test_mapping        # fraction of spec/features scenarios with >=1 linked test

  - id: coverage
    kind: gradient
    metric: changed_line_coverage
    min: 0.90
    description: Line+branch coverage on lines changed in the diff. Global coverage is reported, not gated.

  - id: structure
    kind: gate
    description: Structural metrics and architecture rules.
    thresholds:
      cyclomatic_per_function: 10
      cognitive_per_function: 15
      function_lines: 40
      module_lines: 400
      duplication_pct: 3
      arch_violations: 0
      main_sequence_distance: 0.3
    emits:
      - dependency_graph            # used by scoring for blast radius

  - id: architecture
    kind: gate
    after: structure                # consumes structure.emits.dependency_graph
    description: Architecture decision records (P10). Gates the record, never the decision.
    principles_dir: principles
    decisions_dir: decisions
    blast_radius_trigger: 10
    significance_triggers:          # 1-7 are mandatory; projects MAY add, MUST NOT remove (P10)
      - cross_boundary_dependency
      - new_integration_point
      - published_contract_change
      - system_of_record_change
      - consistency_boundary_change
      - nondeterministic_component_change
      - resilience_policy_change
      - top_level_module_lifecycle
      - blast_radius_above_trigger
      - new_runtime_dependency_in_required_dirs
    rules:
      adr_required_on_trigger: true
      axes_complete: true
      alternatives_non_empty: true          # AP-006
      violation_requires_reason: true
      violation_requires_revisit: true
      expired_revisit_fails: true           # design-debt ratchet, P10
      dead_principle_reference: true
      dead_adr_reference: true
      supersession_acyclic: true
      contract_compat: true                 # AP-064, AP-068
      degradation_scenario_required: true   # AP-062
    checks:
      - principles/check.sh
    emits:
      - adr_coverage                        # navigability gradient
      - open_violations                     # derived ledger, rebuilt from decisions/
      - expired_revisits
      - axis_traversal_completeness

  - id: mutation
    kind: gradient
    metric: mutation_score
    min: 0.85
    scope: diff                     # full on schedule (see schedule below)
    description: Surviving mutants must each be classified equivalent | accepted-risk:#issue | unresolved. unresolved>0 fails.
    secondary_oracle: traced        # kills obtained via trajectory divergence reported separately
    emits:
      - mutation_kills_by_trajectory

  - id: property
    kind: gradient
    metric: invariants_covered      # fraction of spec invariants with a property test
    min: 0.80

  - id: traced
    kind: gradient
    metric: trajectory_match
    min: 1.0                        # any assert-class divergence fails
    golden_dir: traced/golden
    granularity: contract
    description: Golden trajectory comparison. Reports first divergence on failure.

  - id: comments
    kind: gate
    description: Deterministic comment checks (P07). Gradients feed the navigability index.
    banned_phrases: comments/banned-phrases.txt
    emits:
      - lexical_redundancy
      - length_compliance
      - stale_suspects
      - registry_coverage
      - density

  - id: docs
    kind: gate
    description: Bidirectional doc/code linkage (P08).
    required_dirs: [src/domain, src/core]
    complexity_overflow_pct: 50
    emits:
      - orphan_docs
      - doc_stale_suspects
      - header_coverage

  - id: e2e
    kind: gate
    real_execution: true
    description: Gherkin scenarios executed against the running system with real dependencies. No mocks.

  - id: security
    kind: gate
    checks: [sast, secrets, dependency_audit]

  - id: llm-eval
    kind: gradient
    metric: pass_rate_lower_wilson
    min: 0.90
    optional: true                  # required when the project declares llm components
    opts:
      runs_per_sample: 5
      pass_k: 4
      ratchet: true
      pr_subset: 0.2
    description: See P09.

  - id: adversary
    kind: gradient
    metric: unresolved_findings_inverse   # 1 - normalized unresolved findings; unresolved>0 also fails
    min: 1.0
    separate_context: true
    read_only: true
    prefer_different_model: true

schedule:
  nightly:
    - { id: mutation, scope: full }
    - { id: llm-eval, opts: { pr_subset: 1.0 } }
  weekly:
    - comment_judge_stale_suspects
    - doc_judge_stale_suspects
  quarterly:
    - comment_judge_random_sample_10pct
    - recalibrate_weights
    - architecture_boundary_review          # AP-070; outcome is an ADR, including "nothing changed"

evidence:
  output: evidence/EVIDENCE.md
  template: evidence/EVIDENCE-TEMPLATE.md
  fresh_run_required: true
