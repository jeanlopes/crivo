# TypeScript adapter — concrete commands per layer. Merge over ../../layers.yaml.
stack: typescript
layers:
  types:      { cmd: "tsc --noEmit --strict" }
  lint:       { cmd: "eslint . --max-warnings 0 && crivo-checks suppressions", note: "complexity rule set to 10 in eslint config" }
  unit:       { cmd: "crivo-checks repeat 3 -- vitest run --sequence.shuffle --retry 0 --reporter=json --outputFile=.crivo/results/unit.json" }
  coverage:   { cmd: "vitest run --coverage --coverage.reporter=json && crivo-checks changed-line-coverage --min 0.90" }
  structure:  { cmd: "depcruise --config .dependency-cruiser.cjs src && crivo-checks structure" }
  mutation:   { cmd: "stryker run --incremental" }
  property:   { cmd: "vitest run --project property", note: "fast-check" }
  traced:     { cmd: "crivo-trace run --granularity contract --golden traced/golden", note: "node inspector Debugger domain; logpoints" }
  comments:   { cmd: "crivo-checks comments src" }
  docs:       { cmd: "crivo-checks docs src docs" }
  e2e:        { cmd: "docker compose -f compose.e2e.yml up -d && cucumber-js && playwright test && docker compose down" }
  security:
    note: "P11. E2E_URL is the deployment started by the e2e layer. ZAP rules and scanner ignore files are protected paths."
    checks:
      sast:         "semgrep scan --error --metrics=off --config p/owasp-top-ten --config p/javascript --config p/typescript --config p/react --config p/jwt --config security/semgrep src"
      secrets:      "gitleaks git --redact --log-opts=origin/main..HEAD"
      sca:          "osv-scanner scan source --recursive . && npm audit --audit-level=high && npm audit signatures"
      sca_policy:   "crivo-checks dependency-policy --require-lockfile --frozen-install 'npm ci' --ignore-scripts --min-age-days 7"
      suppressions: "security/checks/suppressions.sh src"
      catalogue:    "security/check.sh"
      headers:      "security/checks/headers.sh $E2E_URL"
      sbom:         "syft scan dir:. -o cyclonedx-json=.crivo/results/sbom.cdx.json"
      iac:          "trivy config --severity HIGH,CRITICAL --exit-code 1 ."
      ci:           "zizmor .github/workflows && actionlint"
      dast:         "docker run --rm --network host -v $PWD/.crivo:/zap/wrk ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t $E2E_URL -c zap-rules.tsv -J zap.json"
      fuzz:         "schemathesis run $E2E_URL/openapi.json --checks all"
      abuse:        "cucumber-js --tags @security && crivo-checks abuse-coverage spec/"
    lint_plugins:   "eslint-plugin-security, eslint-plugin-no-unsanitized (in the lint layer's eslint config)"
  llm-eval:   { cmd: "promptfoo eval -c evals/golden.yaml --repeat 5" }
  adversary:  { cmd: "crivo-adversary review --spec spec/ --diff origin/main --model $ADVERSARY_MODEL" }
